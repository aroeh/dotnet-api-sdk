# Podman compose file - same as docker-compose
networks:
  backend:

services:
  cache:
    image: redis
    container_name: redis-cache
    networks:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo
    container_name: mongo-data
    restart: unless-stopped
    networks:
      - backend
  
  otel-lgtm:
    image: grafana/otel-lgtm #grafana/otel-lgtm:0.41.0@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    container_name: grafana-otel-lgtm
    restart: unless-stopped
    networks:
      - backend

  demoapi:
    image: ${DOCKER_REGISTRY-}demoapi
    container_name: demo-api
    networks:
      - backend
    restart: unless-stopped
    build:
      context: . # context at the root is the path containing the compose file
      dockerfile: Demo/Demo.API/Dockerfile
    depends_on:
      - mongo
      - cache
      - otel-lgtm
