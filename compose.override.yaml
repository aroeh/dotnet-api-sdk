services:
  cache:
    ports:
      - 6379:6379

  mongo:
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}

  demoapi:
    ports:
      - 5017:80
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Docker
      - AppConfiguration:ConnectionString=${APP_CONFIG}
    volumes:
      - ${USER_SECRETS_PATH}
